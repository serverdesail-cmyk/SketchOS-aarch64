name: Build SketchOS AArch64 ISO

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "images/SketchOS-AArch64.iso"
      - "images/SketchOS-AArch64.iso.sha256"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal \
            --target aarch64-unknown-none,aarch64-unknown-uefi
          rustup default 1.99.1

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools xorriso

      - name: Build ISO
        run: bash tools/build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: SketchOS-AArch64-ISO
          path: |
            images/SketchOS-AArch64.iso
            images/SketchOS-AArch64.iso.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit ISO to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/SketchOS-AArch64.iso images/SketchOS-AArch64.iso.sha256
          if git diff --cached --quiet; then
            echo "ISO is already up to date"
          else
            git commit -m "Build SketchOS AArch64 ISO"
            git push
          fi
